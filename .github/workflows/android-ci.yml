name: Android CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-environment
      - name: Unit tests, lint and debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: APK for testing
        uses: actions/upload-artifact@v7
        with:
          name: sirin-music-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
